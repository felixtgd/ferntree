services:

  frontend:
    build:
      context: ./
      target: frontend-dev
    ports:
      - 3000:3000
    env_file:
      - ./frontend/.env
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /usr/local/app
        - path: ./frontend/package.json
          action: rebuild
    depends_on:
      - backend

  backend:
    build:
      context: ./
      target: backend-dev
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://ferntree:ferntree@postgres:5432/ferntree_db
    develop:
      watch:
      - path: ./backend
        action: sync
        target: /usr/local/app
      - path: ./backend/requirements.txt
        action: rebuild
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=ferntree
      - POSTGRES_PASSWORD=ferntree
      - POSTGRES_DB=ferntree_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferntree -d ferntree_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: ferntree_network
